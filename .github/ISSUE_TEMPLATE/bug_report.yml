name: バグの報告
description: 動かない・おかしい、を報告する
labels: ["bug", "needs-repro"]
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。日本語で書いてください。
        **セキュリティの問題は、ここに書かないでください**(SECURITY.md を見てください)。
  - type: input
    id: version
    attributes:
      label: AlumiLauncher のバージョン
      description: 設定の一番下に出ています。
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 入れ方
      options:
        - インストーラー版
        - ポータブル版
        - ソースから(開発中)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows のバージョン
      description: "`winver` で分かります。"
      placeholder: "Windows 11 23H2 (22631)"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現の手順
      placeholder: |
        1. …を開く
        2. …を押す
        3. …になる
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動き
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動き
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: ログ(任意)
      description: 設定の「記録(ログ)のフォルダを開く」の `alumi.log` の、関係する部分。ファイルのパスなどが入ることがあるので、確かめてから貼ってください。
      render: text
  - type: textarea
    id: extra
    attributes:
      label: 補足・スクリーンショット
