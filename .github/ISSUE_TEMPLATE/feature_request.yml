name: 機能の要望 / Feature request
description: こんな機能がほしい、を伝える / Suggest an idea
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 困っていること・やりたいこと / The problem
      description: 「何ができなくて困っているか」から書いてください。 / Start from what you are trying to do.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: こうなってほしい / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: ほかに考えた方法 / Alternatives(任意 / optional)
  - type: dropdown
    id: area
    attributes:
      label: どの領域か / Area
      options:
        - ランチャー本体 / Core
        - ウィジェット / Widget
        - ミニアプリ / Mini app
        - 文書 / Docs
        - わからない / Not sure
  - type: checkboxes
    id: contribute
    attributes:
      label: 手伝えますか? / Can you help?
      options:
        - label: 自分で作ってみたい(Pull Request を出せる) / I can send a pull request
