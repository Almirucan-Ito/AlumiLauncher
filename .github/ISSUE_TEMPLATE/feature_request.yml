name: 機能の要望
description: こんな機能がほしい、を伝える
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 困っていること・やりたいこと
      description: 「何ができなくて困っているか」から書いてください。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: こうなってほしい
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: ほかに考えた方法(任意)
  - type: dropdown
    id: area
    attributes:
      label: どの領域か
      options:
        - ランチャー本体
        - ウィジェット
        - ミニアプリ
        - 文書
        - わからない
  - type: checkboxes
    id: contribute
    attributes:
      label: 手伝えますか?
      options:
        - label: 自分で作ってみたい(Pull Request を出せる)
