version: 2
updates:
  # 更新の Pull Request は、develop 宛てに出す
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /src-tauri
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
