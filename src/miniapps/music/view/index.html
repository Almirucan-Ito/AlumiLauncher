<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ミュージック</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="now">
    <div class="art"><svg viewBox="0 0 24 24" fill="#fff"><path d="M9 3l11-2v13.5a3.5 3.5 0 1 1-2-3.15V5.2L11 6.5v11a3.5 3.5 0 1 1-2-3.15z"/></svg></div>
    <div class="meta"><div id="title"></div><div id="sub"></div></div>
    <button id="fav" title="">♡</button>
  </div>
  <div class="seek"><span id="pos">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
  <div class="ctrl">
    <button id="shuffle"><svg viewBox="0 0 24 24"><path d="M17 3h4v4h-2V6.4l-4.6 4.6-1.4-1.4L17.6 5H17zM3 6h4.5l9 11H21v2h-5.5L7 8H3zM3 16h4l2 -2.5 1.4 1.7L8.2 18H3zM17 21v-1.4L14 16.6l1.4-1.4L19 18.8V17h2v4z"/></svg></button>
    <button id="prev"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
    <button id="toggle" class="big"><svg id="ico-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg><svg id="ico-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
    <button id="next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l10.5 7L4 19z"/></svg></button>
    <button id="repeat"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zM17 17H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg><span id="rep1" style="position:absolute;font-size:9px;font-weight:700;display:none">1</span></button>
  </div>
  <div class="opts">
    <button id="mute" style="width:30px;height:30px"><svg viewBox="0 0 24 24" id="ico-vol"><path d="M3 9v6h4l5 5V4L7 9zM16 8.5a5 5 0 0 1 0 7l-1.4-1.4a3 3 0 0 0 0-4.2z"/></svg></button>
    <div class="vol"><input id="vol" type="range" min="0" max="100" value="100"></div>
    <span id="speedL"></span><select id="rate"><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select>
    <span id="sleepL"></span><select id="sleep"><option value="0" id="sleepOff"></option><option value="15">15</option><option value="30">30</option><option value="60">60</option></select>
    <span id="sleepLeft"></span>
  </div>
  <div class="pl" id="plbar">
    <select id="plsel"></select>
    <button id="plnew" class="pill"></button><button id="plren" class="pill"></button><button id="pldel" class="pill"></button>
  </div>
  <div class="pl" id="pledit" style="display:none">
    <input id="plname" maxlength="30">
    <button id="plok" class="pill"></button><button id="plcancel" class="pill"></button>
  </div>
  <div class="bar">
    <button id="addFiles" class="pill"></button>
    <button id="addFolder" class="pill"></button>
    <span class="sp"></span>
    <button id="clear" class="pill"></button>
  </div>
  <div class="list" id="list"></div>
</div>
<script src="../controller/core.js"></script><script src="../controller/render.js"></script><script src="../controller/main.js"></script>
</body>
</html>
